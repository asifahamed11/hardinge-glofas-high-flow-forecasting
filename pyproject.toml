[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hardinge-high-flow-forecasting"
version = "1.0.0"
description = "Leakage-safe multi-horizon high-flow forecasting at Hardinge Bridge"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "cdsapi>=0.7.7,<0.8",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "netCDF4>=1.7,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "Pillow>=10,<13",
  "pyarrow>=17,<24",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "torch>=2.4,<3",
  "xarray>=2024.6,<2027",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.2,<5",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
